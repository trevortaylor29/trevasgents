<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c13"/><stop offset="1" stop-color="#0d1019"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/><stop offset="0.5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.30"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- top bar -->
  <rect x="0" y="0" width="800" height="52" fill="#0f1320"/>
  <circle cx="28" cy="26" r="7" fill="#34d399"/>
  <text x="46" y="31" fill="#e5e7eb" font-size="16" font-weight="700">Mission Control</text>
  <rect x="600" y="16" width="80" height="20" rx="10" fill="#34d399" fill-opacity="0.12"/>
  <text x="640" y="30" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">● live</text>
  <rect x="690" y="16" width="86" height="20" rx="10" fill="#c4b5fd" fill-opacity="0.12"/>
  <text x="733" y="30" fill="#c4b5fd" font-size="11" font-weight="600" text-anchor="middle">5 agents</text>
  <!-- KPI cards -->
  <g>
    <rect x="20" y="70" width="180" height="78" rx="12" fill="#12151f" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="36" y="94" fill="#9ca3af" font-size="11">Portfolio P&amp;L</text>
    <text x="36" y="122" fill="#34d399" font-size="24" font-weight="800">+$1,284</text>
    <text x="36" y="140" fill="#34d399" font-size="11">▲ 4.2%</text>
    <rect x="20" y="70" width="180" height="78" rx="12" fill="none" stroke="#34d399" stroke-opacity="0.25"/>
  </g>
  <g>
    <rect x="212" y="70" width="180" height="78" rx="12" fill="#12151f" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="228" y="94" fill="#9ca3af" font-size="11">Open Positions</text>
    <text x="228" y="122" fill="#e5e7eb" font-size="24" font-weight="800">6</text>
    <text x="228" y="140" fill="#9ca3af" font-size="11">2 flagged to exit</text>
  </g>
  <g>
    <rect x="404" y="70" width="180" height="78" rx="12" fill="#12151f" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="420" y="94" fill="#9ca3af" font-size="11">Fuel spent today</text>
    <text x="420" y="122" fill="#e5e7eb" font-size="24" font-weight="800">$0.42</text>
    <text x="420" y="140" fill="#67e8f9" font-size="11">14 cycles</text>
  </g>
  <g>
    <rect x="596" y="70" width="184" height="78" rx="12" fill="#12151f" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="612" y="94" fill="#9ca3af" font-size="11">System health</text>
    <text x="612" y="122" fill="#e5e7eb" font-size="24" font-weight="800">OK</text>
    <text x="612" y="140" fill="#34d399" font-size="11">all services up</text>
  </g>
  <!-- line chart card -->
  <rect x="20" y="164" width="500" height="216" rx="12" fill="#12151f" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="38" y="190" fill="#e5e7eb" font-size="13" font-weight="700">Portfolio value · 30d</text>
  <polygon points="40,340 40,300 110,285 180,300 250,250 320,265 390,215 460,235 500,205 500,340" fill="url(#area)"/>
  <polyline points="40,300 110,285 180,300 250,250 320,265 390,215 460,235 500,205" fill="none" stroke="url(#line)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="40" y1="352" x2="500" y2="352" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- bar chart card -->
  <rect x="20" y="392" width="500" height="92" rx="12" fill="#12151f" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="38" y="416" fill="#9ca3af" font-size="11">Daily P&amp;L</text>
  <g fill="#c4b5fd">
    <rect x="44" y="446" width="26" height="24" rx="3"/><rect x="82" y="438" width="26" height="32" rx="3"/>
    <rect x="120" y="452" width="26" height="18" rx="3" fill="#f9a8d4"/><rect x="158" y="430" width="26" height="40" rx="3"/>
    <rect x="196" y="444" width="26" height="26" rx="3"/><rect x="234" y="424" width="26" height="46" rx="3" fill="#67e8f9"/>
    <rect x="272" y="450" width="26" height="20" rx="3"/><rect x="310" y="436" width="26" height="34" rx="3"/>
    <rect x="348" y="452" width="26" height="18" rx="3" fill="#f9a8d4"/><rect x="386" y="428" width="26" height="42" rx="3"/>
    <rect x="424" y="446" width="26" height="24" rx="3"/><rect x="462" y="434" width="26" height="36" rx="3" fill="#67e8f9"/>
  </g>
  <!-- agent list card -->
  <rect x="532" y="164" width="248" height="320" rx="12" fill="#12151f" stroke="#ffffff" stroke-opacity="0.06"/>
  <text x="550" y="190" fill="#e5e7eb" font-size="13" font-weight="700">Agents</text>
  <g font-size="12">
    <circle cx="556" cy="216" r="5" fill="#34d399"/><text x="572" y="220" fill="#e5e7eb">Sage</text><text x="762" y="220" fill="#9ca3af" text-anchor="end">idle</text>
    <circle cx="556" cy="248" r="5" fill="#34d399"/><text x="572" y="252" fill="#e5e7eb">Bolt</text><text x="762" y="252" fill="#67e8f9" text-anchor="end">running</text>
    <circle cx="556" cy="280" r="5" fill="#34d399"/><text x="572" y="284" fill="#e5e7eb">Ace</text><text x="762" y="284" fill="#9ca3af" text-anchor="end">idle</text>
    <circle cx="556" cy="312" r="5" fill="#fbbf24"/><text x="572" y="316" fill="#e5e7eb">Scout</text><text x="762" y="316" fill="#9ca3af" text-anchor="end">2h ago</text>
    <circle cx="556" cy="344" r="5" fill="#34d399"/><text x="572" y="348" fill="#e5e7eb">Matt</text><text x="762" y="348" fill="#9ca3af" text-anchor="end">daily</text>
  </g>
  <line x1="550" y1="366" x2="762" y2="366" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="550" y="392" fill="#9ca3af" font-size="11">Latest report</text>
  <text x="550" y="414" fill="#cbd5e1" font-size="11">Bolt: closed ETH +8%, opened</text>
  <text x="550" y="430" fill="#cbd5e1" font-size="11">SOL on momentum. 3 positions.</text>
  <rect x="550" y="446" width="212" height="22" rx="6" fill="#67e8f9" fill-opacity="0.10"/>
  <text x="656" y="461" fill="#67e8f9" font-size="11" font-weight="600" text-anchor="middle">View full report →</text>
